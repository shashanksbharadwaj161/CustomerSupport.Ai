<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M0 Line Recorder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&family=Noto+Sans+Bengali&family=Noto+Sans+Devanagari&family=Noto+Sans+Kannada&family=Noto+Sans+JP&display=swap">
<style>
  :root { --bg:#f7f7f5; --ink:#1b1b1b; --muted:#666; --accent:#2a5bd7; --rec:#c62828; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --ink:#eee; --muted:#aaa; --accent:#7aa2ff; --rec:#ff6b6b; --card:#1f1f1f; } }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:"Noto Sans","Noto Sans Bengali","Noto Sans Devanagari","Noto Sans Kannada","Noto Sans JP",sans-serif; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border-radius:10px; padding:16px; margin:12px 0; }
  .line { font-size:1.7rem; line-height:1.8; margin:12px 0; }
  .meta { color:var(--muted); font-size:.9rem; }
  button, select, input { font:inherit; padding:8px 12px; border-radius:8px; border:1px solid #8884; background:var(--card); color:var(--ink); }
  button.primary { background:var(--accent); color:#fff; border:none; }
  button.rec { background:var(--rec); color:#fff; border:none; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .done { color:#2e7d32; }
</style>
</head>
<body>
<main>
  <h1>M0 line recorder</h1>
  <p class="meta">Read each line naturally, as a caller would. Files stay on this computer; put them in <code>eval/audio/</code>.</p>
  <div class="card">
    <div class="row">
      <label>Speaker nickname <input id="who" placeholder="e.g. spk1" size="10"></label>
      <label>Language <select id="lang"></select></label>
    </div>
    <p><label><input type="checkbox" id="consent"> I agree that my recordings are used to test speech recognition for this project.</label></p>
  </div>
  <div class="card" id="panel" hidden>
    <div class="meta" id="pos"></div>
    <div class="line" id="text"></div>
    <div class="meta" id="note"></div>
    <div class="row">
      <button id="recBtn" class="rec">Record (space)</button>
      <button id="playBtn" disabled>Play</button>
      <button id="saveBtn" class="primary" disabled>Save file</button>
      <button id="prevBtn">Back</button>
      <button id="nextBtn">Next (n)</button>
    </div>
    <audio id="player" controls hidden></audio>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let lines = [], view = [], idx = 0, rec = null, chunks = [], blob = null;
const saved = new Set();
const NOTES = { romanized_hi: "Say it in Hindi; the text is romanized on purpose.",
                romanized_bn: "Say it in Bengali; the text is romanized on purpose." };

fetch("../lines/test_lines.jsonl").then(r => r.text()).then(t => {
  lines = t.trim().split("\n").map(JSON.parse);
  const langs = ["en","ja","hi","bn","kn","mixed"];
  $("lang").innerHTML = langs.map(l => `<option value="${l}">${l}</option>`).join("");
  $("lang").onchange = pick; pick();
});

function pick() {
  const l = $("lang").value;
  view = lines.filter(x => l === "mixed" ? x.category !== "mono" : (x.category === "mono" && x.lang === l));
  idx = 0; show();
}
function show() {
  const x = view[idx]; if (!x) return;
  $("panel").hidden = false;
  $("pos").textContent = `${x.id}  (${idx+1}/${view.length})` + (saved.has(x.id) ? "  saved" : "");
  $("text").textContent = x.text;
  $("text").lang = x.lang;
  $("note").textContent = NOTES[x.category] || (x.category !== "mono" ? "Mixed-language line: speak it as written." : "");
  blob = null; $("playBtn").disabled = $("saveBtn").disabled = true; $("player").hidden = true;
}
async function toggle() {
  if (!$("consent").checked) { alert("Please confirm consent first."); return; }
  if (rec && rec.state === "recording") { rec.stop(); return; }
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } });
  chunks = []; rec = new MediaRecorder(stream);
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    blob = new Blob(chunks, { type: rec.mimeType });
    $("player").src = URL.createObjectURL(blob); $("player").hidden = false;
    $("playBtn").disabled = $("saveBtn").disabled = false;
    $("recBtn").textContent = "Record (space)";
  };
  rec.start(); $("recBtn").textContent = "Stop (space)";
}
function save() {
  if (!blob) return;
  const ext = (blob.type.includes("ogg") ? "ogg" : blob.type.includes("mp4") ? "m4a" : "webm");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `${view[idx].id}.${ext}`; a.click();
  saved.add(view[idx].id); show();
}
$("recBtn").onclick = toggle; $("saveBtn").onclick = save;
$("playBtn").onclick = () => $("player").play();
$("nextBtn").onclick = () => { if (idx < view.length-1) { idx++; show(); } };
$("prevBtn").onclick = () => { if (idx > 0) { idx--; show(); } };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.code === "Space") { e.preventDefault(); toggle(); }
  if (e.key === "n") $("nextBtn").click();
});
</script>
</body>
</html>
